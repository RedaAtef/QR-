<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتح الكاميرا</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .cam-btn {
            background-color: #25D366;
            color: white;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- تم التغيير إلى capture="user" لفتح الكاميرا الأمامية -->
    <input type="file" accept="image/*" capture="user" id="cameraInput" style="display: none;">
    <label for="cameraInput" class="cam-btn">
        📸 اضغط هنا لفتح الكاميرا
    </label>
</body>
</html>
